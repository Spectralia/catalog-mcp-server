[project]
name = "catalog"
version = "0.1.0"
description = "An MCP server exposing a competitive product intelligence catalog"
readme = "README.md"
requires-python = ">=3.10"
# Deliberately minimal: the storage layer is the stdlib `sqlite3` module, so
# there is no ORM, no web framework, and no vector store to install.
dependencies = [
    "mcp[cli]>=2.0.0",
    # Every tool input and output is a Pydantic model; Field(description=...)
    # feeds the JSON Schema the model reads.
    "pydantic>=2.0.0",
]

[build-system]
requires = [ "hatchling",]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catalog"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.15.8",
]

[project.scripts]
catalog-server = "catalog.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["README.md"]

[tool.ruff.lint]
select = [
    "C4",   # flake8-comprehensions
    "C90",  # mccabe
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "PERF", # Perflint
    "PL",   # Pylint
    "T20",  # flake8-print -- stdout is the MCP wire protocol; print() must not appear
    "UP",   # pyupgrade
]
ignore = ["PERF203", "PLC0415", "PLR0402"]
mccabe.max-complexity = 24 # Default is 10

[tool.ruff.lint.pylint]
allow-magic-value-types = ["bytes", "float", "int", "str"]
max-args = 23                                              # Default is 5
max-branches = 23                                          # Default is 12
max-returns = 13                                           # Default is 6
max-statements = 102                                       # Default is 50
